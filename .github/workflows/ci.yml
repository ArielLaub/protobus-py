name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/unit -q --timeout 120

  integration:
    name: Integration tests against RabbitMQ
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Integration suite
        env:
          PROTOBUS_TEST_AMQP_URL: amqp://guest:guest@localhost:5672/
          RABBITMQ_MGMT: http://guest:guest@localhost:15672
        run: python -m pytest tests/integration -q --timeout 300 -m "not cross_language"
      - name: Combat-game sample
        env:
          AMQP_URL: amqp://guest:guest@localhost:5672/
        run: PYTHON=python scripts/run-combat-sample.sh
      - name: Getting Started tutorial, as written
        env:
          AMQP_URL: amqp://guest:guest@localhost:5672/
        run: PYTHON=python scripts/check-getting-started.sh

  cross-language:
    name: Wire compatibility with TypeScript protobus
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: protobus-py
      - uses: actions/checkout@v4
        with:
          repository: ArielLaub/protobus
          path: protobus
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the TypeScript port
        working-directory: protobus
        run: npm ci && npm run build-ts
      - name: Install the Python port
        working-directory: protobus-py
        run: pip install -e ".[dev]"
      - name: Python client -> TypeScript server
        working-directory: protobus-py
        env:
          PROTOBUS_TEST_AMQP_URL: amqp://guest:guest@localhost:5672/
          PROTOBUS_TS: ${{ github.workspace }}/protobus
        run: python -m pytest tests/integration/test_cross_language.py -q --timeout 300
      - name: TypeScript client -> Python server
        working-directory: protobus
        run: |
          python -m venv ../protobus-py/venv
          ../protobus-py/venv/bin/pip install -e ../protobus-py
          npx jest --config jest.integration.config.js cross-language

  package:
    name: Build and smoke-test the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel in a clean environment and import it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import protobus; print(protobus.__version__); protobus.MessageFactory().init()"
          /tmp/smoke/bin/protobus --version
