[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protobus"
version = "2.0.0"
description = "Protobus: RabbitMQ + Protocol Buffers micro-services framework (Python port, wire-compatible with the TypeScript original)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ariel Laub", email = "ariel@laub.co.il"}
]
keywords = ["micro services", "bus", "amqp", "rabbitmq", "protobuf", "scalable"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.10"
dependencies = [
    "aiormq>=6.8,<7",
    "protobuf>=5.26,<7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.3",
    "mypy>=1.8",
    "ruff>=0.4",
    "build>=1.0",
]

[project.scripts]
protobus = "protobus.cli.main:main"

[project.urls]
Homepage = "https://github.com/ArielLaub/protobus-py"
Repository = "https://github.com/ArielLaub/protobus-py"
Issues = "https://github.com/ArielLaub/protobus-py/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["protobus*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
markers = [
    "integration: needs a RabbitMQ broker (PROTOBUS_TEST_AMQP_URL)",
    "cross_language: needs the TypeScript protobus checkout built next to this one",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
